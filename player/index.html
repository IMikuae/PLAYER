<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1db954">
  <meta name="description" content="Local-first audio player, offline PWA.">
  <title>Local Player — Offline PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css?v=14">
</head>
<body>
  <div class="player-container">
    <audio id="audioPlayer" preload="metadata"></audio>
    <input type="file" id="fileInput" multiple accept="audio/*,.mp3,.m4a,.wav,.ogg,.opus,.flac,.aac" style="display:none">

    <section class="player-section" aria-label="Pemutar">
      <div class="topbar">
        <button class="icon-btn" id="themeBtn" title="Tema" aria-label="Ganti tema"></button>
      </div>

      <div class="album-wrapper">
        <img src="assets/icon.svg" alt="Album Art" class="album-art" id="albumArt">
        <div class="center-hole" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
      </div>

      <div class="song-info">
        <div class="song-title" id="songTitle">Belum Ada Lagu</div>
        <div class="song-artist" id="songArtist">Pilih "+ Tambah"</div>
        <div class="song-meta" id="songMeta"></div>
      </div>

      <div class="progress-area">
        <span class="time" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar" role="slider" tabindex="0" aria-label="Posisi lagu" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time" id="totalTime">0:00</span>
      </div>

      <div class="controls">
        <button class="btn" id="shuffleBtn" title="Shuffle" aria-label="Shuffle" aria-pressed="false"></button>
        <button class="btn" id="prevBtn" title="Sebelumnya (P)" aria-label="Sebelumnya" disabled></button>
        <button class="btn btn-play" id="playBtn" title="Play/Pause (Spasi)" aria-label="Play" disabled></button>
        <button class="btn" id="nextBtn" title="Berikutnya (N)" aria-label="Berikutnya" disabled></button>
        <button class="btn" id="repeatBtn" title="Repeat: off → all → one" aria-label="Repeat"><span class="repeat-mode" id="repeatLabel"></span></button>
      </div>

      <div class="sub-controls">
        <div class="volume-wrap">
          <button class="btn" id="muteBtn" aria-label="Mute" style="font-size:18px"></button>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        </div>
        <div class="speed-sleep">
          <label class="ctl-label">Kecepatan
            <select id="rateSelect" class="ctl-select">
              <option value="0.75">0.75x</option>
              <option value="1" selected>1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </label>
          <label class="ctl-label">Timer tidur
            <select id="sleepSelect" class="ctl-select">
              <option value="0" selected>Mati</option>
              <option value="15">15 menit</option>
              <option value="30">30 menit</option>
              <option value="60">60 menit</option>
            </select>
          </label>
        </div>
      </div>
      <div class="hint">Spasi play/pause • ←/→ 5s • N/P next/prev • M mute • L favorit</div>
    </section>

    <section class="playlist-section" aria-label="Playlist">
      <div class="playlist-header">
        <div class="playlist-toprow">
          <div class="playlist-title">Antrean <small id="countLabel"></small></div>
          <div class="header-actions">
            <button class="ghost-btn" id="clearBtn" title="Hapus semua">Hapus</button>
            <button class="add-music-btn" id="addMusicBtn">+ Tambah</button>
          </div>
        </div>
        <input class="search-input" id="searchInput" type="search" placeholder="Cari judul / artis..." aria-label="Cari lagu">
        <div class="storage-info" id="storageInfo" aria-live="polite"></div>
        <div class="reorder-hint" id="reorderHint" aria-live="polite"></div>
        <div class="q-seg" role="tablist">
          <button class="tab-btn active" data-filter="all" role="tab" aria-selected="true">Semua</button>
          <button class="tab-btn" data-filter="fav" role="tab" aria-selected="false">Favorit</button>
          <button class="tab-btn" data-filter="audio" role="tab" aria-selected="false">Audio</button>
        </div>
      </div>
      <div class="track-list" id="trackList" role="listbox" aria-label="Daftar lagu">
        <div class="empty-state">Memuat...</div>
      </div>
    </section>
  </div>

  <div class="drop-overlay" id="dropOverlay">Tarik & letakkan file audio di sini</div>
  <div class="toast" id="toast" role="status"></div>

  <script src="js/vendor/jsmediatags.min.js" integrity="sha384-JpTt7qxVx1X/pHeYiCfqFdKRu2HF1MBGr1kEXtbNIGwwryGWMbbW78onU3bdkAHZ"></script>
  <script type="module" src="js/player.js"></script>
</body>
</html>
